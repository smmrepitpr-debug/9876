<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../style.css">
<style>
html,body{width:var(--w);height:var(--h);margin:0;overflow:hidden;background:#02140D}
.strips{position:absolute;inset:-40px -80px;display:flex;gap:14px;transform:skewX(-8deg)}
.strips div{flex:1;background-size:cover;background-position:center;filter:saturate(1.1) contrast(1.05);transform:translateY(var(--dy,0))}
.shade{position:absolute;inset:0;background:radial-gradient(ellipse at center, rgba(2,20,13,.92) 0%, rgba(2,20,13,.75) 30%, rgba(2,20,13,.15) 65%, rgba(2,20,13,.35) 100%)}
.plate{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;width:var(--pw)}
.brand{display:flex;align-items:center;justify-content:center;gap:22px;font-weight:900;font-size:var(--bs)}
.t1{font-weight:900;font-size:var(--ts);line-height:1.02;margin-top:14px;text-transform:uppercase}
.t1 b{color:#3DDC97;text-shadow:0 0 40px rgba(61,220,151,.5)}
.chips{margin-top:22px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.chips span{padding:10px 22px;border-radius:999px;background:rgba(61,220,151,.16);border:2px solid rgba(61,220,151,.6);font-weight:800;font-size:var(--cs);color:#E9FFF5}

body.desk .strips{inset:0;left:auto;right:0;width:1180px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:10px;padding:10px;transform:none}
body.desk .strips div{transform:none;border-radius:20px}
body.desk .shade{background:linear-gradient(90deg,#02140D 0%,#02140D 37%,rgba(2,20,13,0) 39%)}
body.desk .plate{left:60px;top:61%;transform:translateY(-50%);text-align:left;width:640px}
body.desk .t1 br{display:none}body.desk .t1 .l2{display:block}
body.desk .brand{justify-content:flex-start}
body.desk .chips{justify-content:flex-start}
body.desk .tag{position:absolute;left:14px;bottom:12px;padding:6px 14px;border-radius:999px;background:rgba(2,20,13,.75);color:#fff;font-weight:800;font-size:22px}
</style></head><body>
<div class="strips"></div><div class="shade"></div>
<div class="plate"><div class="brand"><div class="logo" id="lg"></div>Команда</div>
<div class="t1">Найди <b>тренера</b><br><span class="l2">в пару касаний</span></div>
<div class="chips"><span>Сноуборд</span><span>Теннис</span><span>Бачата</span><span>Армрестлинг</span><span>Плавание</span><span>Бокс</span></div></div>
<script src="../k3d.js"></script>
<script>
const q=new URLSearchParams(location.search), m=q.get('m');
const S=document.documentElement.style;
if(m!=='mob')document.body.classList.add('desk'); else document.querySelector('.chips').style.display='none';
if(m==='mob'){S.setProperty('--w','1080px');S.setProperty('--h','1920px');S.setProperty('--pw','960px');S.setProperty('--bs','80px');S.setProperty('--ts','110px');S.setProperty('--cs','34px');}
else{S.setProperty('--w','1920px');S.setProperty('--h','768px');S.setProperty('--pw','700px');S.setProperty('--bs','64px');S.setProperty('--ts','62px');S.setProperty('--cs','22px');}
const ids=[['7130','0010','50% 60%'],['873','0040','45% 40%'],['303','0075','60% 35%'],['44414','0075','50% 45%'],['33192','0040','50% 50%'],['40276','0040','45% 40%']];
const st=document.querySelector('.strips');
const names=['Сноуборд','Теннис','Бачата','Армрестлинг','Плавание','Бокс'];
ids.forEach(([id,fr,pos],i)=>{const d=document.createElement('div');const U={'7130':['snow1','50% 30%'],'873':['ten3','60% 40%'],'303':['dan2','50% 40%'],'44414':['arm1','45% 50%'],'33192':['sw1','50% 50%'],'40276':['box3','60% 35%']}[id];d.style.backgroundImage=`url(u/${U[0]}.jpg)`;d.style.backgroundPosition=U[1];d.innerHTML=`<span class="tag" style="position:absolute;left:14px;bottom:12px;padding:6px 14px;border-radius:999px;background:rgba(2,20,13,.75);color:#fff;font-weight:800;font-size:22px">${names[i]}</span>`;d.style.position='relative';d.style.setProperty('--dy',(i%2?18:-18)+'px');st.appendChild(d);});
if(m==='mob'){st.style.cssText='position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:12px;padding:12px;transform:none';[...st.children].forEach(d=>{d.style.borderRadius='26px';d.style.transform='none';});}
const lg=document.getElementById('lg'); const s=m==='mob'?110:84; lg.style.width=lg.style.height=s+'px'; lg.style.borderRadius=s*.24+'px'; lg.innerHTML=LOGO_SVG(s*.7);
document.fonts.load('900 50px Rubik').then(()=>window.READY=true);
</script></body></html>
