<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Фитнес Плаза — LED 5:1</title>
<style>
  @font-face { font-family: "Rubik"; font-weight: 300 900; font-display: block;
    src: url(fonts/rubik-cyrillic.woff2) format("woff2");
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: "Rubik"; font-weight: 300 900; font-display: block;
    src: url(fonts/rubik-latin.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  html, body { margin: 0; background: #02050C; overflow: hidden; }
  canvas { display: block; }
  #hint { position: fixed; left: 8px; bottom: 8px; font: 12px sans-serif; color: #5CF0FF88; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">пробел — пауза · ← → — кадр · ?w=3600&h=600 — другой размер · ?render=1 — без автоплея</div>
<script>
/* =========================================================
   ФИТНЕС ПЛАЗА — LED 5:1. Всё считается от u = H / 600.
   Размер меняется параметрами ?w=3000&h=600 (или константами ниже).
   window.seek(t) рисует кадр на время t (сек) — им пользуется рендер.
   ========================================================= */
const Q = new URLSearchParams(location.search);
const W = +Q.get('w') || 3000;
const H = +Q.get('h') || 600;
const u = H / 600;
const FPS = 30;

const C = {
  bg: '#02050C', blue: '#2F8BFF', cyan: '#5CF0FF', white: '#FFFFFF',
  red: '#FF2A55',
};
const FONT = '"Rubik"';
const EMOJI = '"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';

const SCENES = [2.0, 2.8, 2.8, 3.3, 3.0];
const STARTS = SCENES.reduce((a, d, i) => (a.push(i ? a[i - 1] + SCENES[i - 1] : 0), a), []);
const DURATION = STARTS[4] + SCENES[4];           // 13.9 с
window.DURATION = DURATION; window.FPS = FPS; window.W = W; window.H = H;

const SAFE_X = W * 0.05, SAFE_Y = H * 0.05;
const CX = W / 2, CY = H / 2;

const cv = document.getElementById('c');
cv.width = W; cv.height = H;
cv.style.width = Math.min(innerWidth, W) + 'px';
const ctx = cv.getContext('2d');

/* ---------- утилиты ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, v) => clamp((v - a) / (b - a));
const eOut3 = t => 1 - Math.pow(1 - t, 3);
const eOut5 = t => 1 - Math.pow(1 - t, 5);
const eInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eBack = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const hash = (n) => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };
const noise = (t, seed) => {             // гладкий 1D шум -1..1
  const i = Math.floor(t), f = t - i, s = f * f * (3 - 2 * f);
  return lerp(hash(i + seed * 57), hash(i + 1 + seed * 57), s) * 2 - 1;
};
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}
function font(size, weight = 900) { return `${weight} ${size}px ${FONT}`; }
function fitSize(text, maxW, size, weight = 900) {
  ctx.font = font(size, weight);
  const w = ctx.measureText(text).width;
  return w > maxW ? size * maxW / w : size;
}

/* ---------- фон: неоновая сетка ---------- */
function drawGrid(t) {
  const hz = CY;                          // горизонт
  ctx.save();
  ctx.lineWidth = 1.4 * u;
  for (const dir of [1, -1]) {            // пол и потолок
    // продольные линии к точке схода
    for (let i = -24; i <= 24; i++) {
      const xb = CX + i * 150 * u + Math.sin(t * .35) * 40 * u;
      const a = 0.16 * (1 - Math.abs(i) / 26);
      ctx.strokeStyle = hexA(C.blue, a);
      ctx.beginPath();
      ctx.moveTo(CX + (xb - CX) * 0.04, hz + dir * 6 * u);
      ctx.lineTo(xb + (xb - CX) * 1.6, dir > 0 ? H + 20 : -20);
      ctx.stroke();
    }
    // поперечные линии бегут к зрителю
    const speed = 0.55;
    for (let k = 0; k < 14; k++) {
      const z = ((k + t * speed * 3) % 14) / 14;       // 0 — горизонт, 1 — у зрителя
      const p = Math.pow(z, 2.4);
      const y = hz + dir * (6 * u + p * (H / 2));
      const a = 0.04 + 0.22 * p;
      ctx.strokeStyle = hexA(z > .7 ? C.cyan : C.blue, a);
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
  }
  // светящийся горизонт
  const g = ctx.createLinearGradient(0, hz - 30 * u, 0, hz + 30 * u);
  g.addColorStop(0, 'rgba(47,139,255,0)'); g.addColorStop(.5, 'rgba(47,139,255,.22)'); g.addColorStop(1, 'rgba(47,139,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, hz - 30 * u, W, 60 * u);
  ctx.restore();
}

/* ---------- световые пятна (дыхание фона) ---------- */
function drawAura(t) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const blobs = [
    [0.18, 0.5, C.blue, 0.22, 0], [0.82, 0.5, C.blue, 0.22, 2],
    [0.5, 0.5, C.cyan, 0.10, 4],
  ];
  for (const [bx, by, col, a, s] of blobs) {
    const x = W * bx + noise(t * .4, s) * 160 * u, y = H * by + noise(t * .5, s + 9) * 60 * u;
    const r = 520 * u * (1 + 0.15 * Math.sin(t * 1.3 + s));
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, hexA(col, a)); g.addColorStop(1, hexA(col, 0));
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  ctx.restore();
}

/* ---------- частицы ---------- */
const PARTS = (() => { const r = rng(7); return Array.from({ length: 160 }, () => ({
  x: r(), y: r(), s: 0.6 + r() * 2.6, v: 0.02 + r() * 0.06, ph: r() * 6.28, c: r() < .65 ? C.cyan : C.blue,
})); })();
function drawParticles(t) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const p of PARTS) {
    const y = ((p.y - t * p.v) % 1 + 1) % 1;
    const x = p.x + Math.sin(t * .8 + p.ph) * 0.006;
    const tw = 0.4 + 0.6 * Math.pow(Math.abs(Math.sin(t * 2 + p.ph)), 3);
    const r = p.s * u * 2.2;
    const px = x * W, py = y * H;
    const g = ctx.createRadialGradient(px, py, 0, px, py, r * 4);
    g.addColorStop(0, hexA('#FFFFFF', .9 * tw)); g.addColorStop(.25, hexA(p.c, .6 * tw)); g.addColorStop(1, hexA(p.c, 0));
    ctx.fillStyle = g; ctx.fillRect(px - r * 4, py - r * 4, r * 8, r * 8);
  }
  ctx.restore();
}

/* ---------- кольца из центра ---------- */
function drawRings(t) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const emit = [];
  STARTS.forEach(s => { emit.push(s + .05, s + .2); });
  for (let k = 0; k < DURATION / 0.9; k++) emit.push(k * 0.9 + .45);
  for (const e of emit) {
    const a = t - e; if (a < 0 || a > 2.2) continue;
    const p = a / 2.2;
    const r = 40 * u + eOut3(p) * W * 0.55;
    const al = (1 - p) * 0.55;
    ctx.lineWidth = (6 - 4.5 * p) * u;
    ctx.strokeStyle = hexA(p < .3 ? C.cyan : C.blue, al);
    ctx.shadowColor = C.cyan; ctx.shadowBlur = 24 * u;
    ctx.beginPath(); ctx.ellipse(CX, CY, r, r * 0.42, 0, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}

/* ---------- текст: RGB-расслоение + маска по словам ---------- */
function glowText(str, x, y, size, { weight = 900, split = 0, color = C.white, glow = C.cyan, alpha = 1, glowAmt = 1 } = {}) {
  ctx.font = font(size, weight);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (split > 0.2 * u) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = alpha * 0.9;
    ctx.fillStyle = C.red; ctx.fillText(str, x - split, y + split * 0.15);
    ctx.fillStyle = '#00E1FF'; ctx.fillText(str, x + split, y - split * 0.15);
    ctx.restore();
  }
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.shadowColor = glow; ctx.shadowBlur = 38 * u * glowAmt;
  ctx.fillStyle = color; ctx.fillText(str, x, y);
  ctx.shadowBlur = 12 * u * glowAmt; ctx.fillText(str, x, y);
  ctx.restore();
}

// строка, слова которой выезжают снизу по одному из-под маски
function wordsLine(str, y, size, t0, t, { weight = 900, stagger = 0.09, dur = 0.42, rgb = 22, color = C.white, glow = C.cyan, alpha = 1 } = {}) {
  ctx.font = font(size, weight);
  const words = str.split(' ');
  const space = ctx.measureText(' ').width;
  const ws = words.map(w => ctx.measureText(w).width);
  const total = ws.reduce((a, b) => a + b, 0) + space * (words.length - 1);
  let x = CX - total / 2;
  words.forEach((w, i) => {
    const p = inv(t0 + i * stagger, t0 + i * stagger + dur, t);
    if (p <= 0) { x += ws[i] + space; return; }
    const e = eOut5(p);
    const dy = (1 - e) * size * 1.05;
    const glitch = (p < 1 ? 1 : 0) * noise(t * 30, i + 3) * 6 * u;
    const split = (1 - eOut3(p)) * rgb * u + Math.abs(glitch);
    ctx.save();
    ctx.beginPath(); ctx.rect(x - size * 0.4, y - size * 0.7, ws[i] + size * 0.8, size * 1.32); ctx.clip();
    glowText(w, x + ws[i] / 2 + glitch, y + dy, size, { weight, split, color, glow, alpha });
    ctx.restore();
    x += ws[i] + space;
  });
}

/* ---------- блик ---------- */
function drawSweep(lt) {
  const p = inv(0.12, 0.85, lt); if (p <= 0 || p >= 1) return;
  const x = lerp(-0.3 * W, 1.3 * W, eInOut(p));
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.translate(x, CY); ctx.transform(1, 0, -0.9, 1, 0, 0);
  const bw = 260 * u;
  const g = ctx.createLinearGradient(-bw, 0, bw, 0);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.45, 'rgba(92,240,255,.10)');
  g.addColorStop(.5, 'rgba(255,255,255,.28)'); g.addColorStop(.55, 'rgba(92,240,255,.10)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(-bw, -H, bw * 2, H * 2);
  ctx.restore();
}

/* ---------- переходы: вертикальные полосы ---------- */
function drawBars(t) {
  const cuts = STARTS.slice(1);
  for (const T of cuts) {
    const bars = [
      { c: C.white, w: 0.07, d: -0.07 }, { c: C.cyan, w: 0.18, d: -0.035 }, { c: C.blue, w: 1.25, d: 0 },
    ];
    for (const b of bars) {
      const p = inv(T - 0.24 + b.d, T + 0.24 + b.d, t); if (p <= 0 || p >= 1) continue;
      const bw = b.w * W;
      const x = lerp(-bw, W, eInOut(p));
      ctx.save();
      ctx.shadowColor = b.c; ctx.shadowBlur = 40 * u;
      ctx.fillStyle = b.c; ctx.fillRect(x, -10, bw, H + 20);
      if (b.c === C.blue) {            // внутренняя текстура синей полосы
        ctx.shadowBlur = 0; ctx.fillStyle = 'rgba(92,240,255,.25)';
        for (let k = 0; k < 6; k++) ctx.fillRect(x + bw * (0.1 + k * 0.15), -10, 8 * u, H + 20);
      }
      ctx.restore();
    }
  }
}

/* ---------- HUD ---------- */
function drawHUD(t) {
  // виньетка
  ctx.save();
  ctx.translate(CX, CY); ctx.scale(W / H, 1);
  const g = ctx.createRadialGradient(0, 0, H * 0.25, 0, 0, H * 0.75);
  g.addColorStop(0, 'rgba(2,5,12,0)'); g.addColorStop(1, 'rgba(2,5,12,.88)');
  ctx.fillStyle = g; ctx.fillRect(-H, -H, H * 2, H * 2);
  ctx.restore();
  // сканлайны (едва заметно — LED любит)
  ctx.save(); ctx.globalAlpha = 0.05; ctx.fillStyle = '#000';
  for (let y = 0; y < H; y += 4 * u) ctx.fillRect(0, y, W, 1.5 * u);
  ctx.restore();
  // REC
  const s = 26 * u;
  ctx.save();
  ctx.font = font(s, 900); ctx.textBaseline = 'middle';
  const on = Math.floor(t * 2) % 2 === 0;
  ctx.fillStyle = on ? C.red : hexA(C.red, .25);
  ctx.shadowColor = C.red; ctx.shadowBlur = on ? 18 * u : 0;
  ctx.beginPath(); ctx.arc(SAFE_X + s * 0.45, SAFE_Y + s * 0.6, s * 0.38, 0, 7); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = hexA(C.white, .9); ctx.textAlign = 'left';
  ctx.fillText('REC', SAFE_X + s * 1.2, SAFE_Y + s * 0.62);
  // PLAZA · УХТА
  ctx.textAlign = 'right'; ctx.fillStyle = hexA(C.white, .85);
  ctx.shadowColor = C.cyan; ctx.shadowBlur = 12 * u;
  ctx.fillText('PLAZA · УХТА', W - SAFE_X, SAFE_Y + s * 0.62);
  ctx.restore();
}

/* ---------- иконка ИИ ---------- */
function aiIcon(x, y, r, t, lt) {
  ctx.save(); ctx.translate(x, y);
  ctx.globalCompositeOperation = 'lighter';
  // внешнее кольцо из штрихов, вращается
  ctx.rotate(lt * 1.6);
  ctx.lineWidth = 6 * u; ctx.strokeStyle = C.cyan; ctx.shadowColor = C.cyan; ctx.shadowBlur = 28 * u;
  ctx.setLineDash([22 * u, 14 * u]);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke();
  ctx.setLineDash([]);
  ctx.rotate(-lt * 3.4);
  ctx.lineWidth = 3 * u; ctx.strokeStyle = C.blue;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.84, 0.3, 2.6); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, r * 0.84, 3.4, 5.8); ctx.stroke();
  // орбитальная точка
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(r * 0.84, 0, 6 * u, 0, 7); ctx.fill();
  ctx.restore();
  // заливка
  ctx.save();
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 0.78);
  g.addColorStop(0, hexA(C.blue, .55)); g.addColorStop(1, hexA(C.blue, .08));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 0.76, 0, 7); ctx.fill();
  ctx.restore();
  glowText('ИИ', x, y + r * 0.04, r * 0.82, { split: 0, glowAmt: 1.3 });
}

/* ---------- логотип (силуэт со штангой) ---------- */
const LOGO = new Image(); let LOGO_OK = false;
LOGO.onload = () => { LOGO_OK = true; }; LOGO.src = 'logo.png';   // положите свой logo.png рядом — подхватится сам
function logo(x, y, s, glow) {
  if (LOGO_OK) {
    const k = s * 2 / Math.max(LOGO.width, LOGO.height);
    ctx.save(); ctx.shadowColor = C.blue; ctx.shadowBlur = 40 * u * glow;
    ctx.drawImage(LOGO, x - LOGO.width * k / 2, y - LOGO.height * k / 2, LOGO.width * k, LOGO.height * k);
    ctx.restore(); return;
  }
  ctx.save(); ctx.translate(x, y); ctx.scale(s / 100, s / 100);
  ctx.fillStyle = C.blue; ctx.strokeStyle = C.blue;
  ctx.shadowColor = C.cyan; ctx.shadowBlur = 30 * u * glow;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // гриф
  ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(-92, -62); ctx.lineTo(92, -62); ctx.stroke();
  // блины
  for (const sx of [-1, 1]) {
    ctx.beginPath(); ctx.roundRect(sx * 80 - 9, -92, 18, 60, 5); ctx.fill();
    ctx.beginPath(); ctx.roundRect(sx * 62 - 7, -84, 14, 44, 4); ctx.fill();
  }
  // руки
  ctx.lineWidth = 13;
  ctx.beginPath(); ctx.moveTo(-44, -62); ctx.lineTo(-30, -18); ctx.lineTo(-17, 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(44, -62); ctx.lineTo(30, -18); ctx.lineTo(17, 2); ctx.stroke();
  // голова
  ctx.beginPath(); ctx.arc(0, -22, 15, 0, 7); ctx.fill();
  // торс (трапеция)
  ctx.beginPath(); ctx.moveTo(-24, 0); ctx.lineTo(24, 0); ctx.lineTo(14, 48); ctx.lineTo(-14, 48); ctx.closePath(); ctx.fill();
  // ноги
  ctx.lineWidth = 15;
  ctx.beginPath(); ctx.moveTo(-10, 46); ctx.lineTo(-26, 76); ctx.lineTo(-24, 98); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10, 46); ctx.lineTo(26, 76); ctx.lineTo(24, 98); ctx.stroke();
  ctx.restore();
}

/* ---------- лайки (сцена 4) ---------- */
const LIKES = (() => { const r = rng(42), e = ['👍', '❤️', '🔥', '💪']; return Array.from({ length: 46 }, (_, i) => ({
  x: 0.03 + r() * 0.94, t0: r() * 2.6, sp: 0.45 + r() * 0.5, sz: 34 + r() * 40, ph: r() * 6.28, e: e[i % 4],
})); })();

/* =========================================================
   СЦЕНЫ (lt — локальное время сцены)
   ========================================================= */
const maxTextW = W - SAFE_X * 2;

function scene1(lt) {
  const size = fitSize('У ПЛАЗЫ НОВАЯ ФИШКА', maxTextW * 0.98, 250 * u);
  wordsLine('У ПЛАЗЫ НОВАЯ ФИШКА', CY + 6 * u, size, 0.08, lt, { stagger: 0.11, dur: 0.38, rgb: 46 });
  // постоянный лёгкий глитч на «ФИШКА»
}

function scene2(lt) {
  const size = fitSize('ВСЕ ТРЕНЕРЫ РАБОТАЮТ', maxTextW * 0.94, 190 * u);
  const y1 = CY - 50 * u;
  wordsLine('ВСЕ ТРЕНЕРЫ РАБОТАЮТ', y1, size, 0.12, lt, { rgb: 34 });
  // тонкая строка с линиями
  const p = inv(0.75, 1.25, lt); if (p <= 0) return;
  const s2 = 56 * u, y2 = CY + 118 * u, txt = 'с приложением «Команда»';
  ctx.font = font(s2, 500);
  const tw = ctx.measureText(txt).width;
  ctx.save(); ctx.globalAlpha = eOut3(p);
  glowText(txt, CX, y2 + (1 - eOut3(p)) * 20 * u, s2, { weight: 500, color: C.cyan, glow: C.blue, glowAmt: .7 });
  const L = 340 * u * eOut5(inv(0.9, 1.5, lt)), gap = 34 * u;
  ctx.strokeStyle = C.cyan; ctx.lineWidth = 3 * u; ctx.shadowColor = C.cyan; ctx.shadowBlur = 16 * u;
  ctx.beginPath(); ctx.moveTo(CX - tw / 2 - gap, y2); ctx.lineTo(CX - tw / 2 - gap - L, y2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(CX + tw / 2 + gap, y2); ctx.lineTo(CX + tw / 2 + gap + L, y2); ctx.stroke();
  for (const sx of [-1, 1]) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(CX + sx * (tw / 2 + gap + L), y2, 5 * u, 0, 7); ctx.fill(); }
  ctx.restore();
}

function scene3(lt) {
  const word = 'ПОМОЩНИК', size = 200 * u;
  ctx.font = font(size);
  const ww = ctx.measureText(word).width;
  const r = 118 * u, gap = 70 * u;
  const total = r * 2 + gap + ww;
  const y = CY - 40 * u;
  const ix = CX - total / 2 + r, wx = CX - total / 2 + r * 2 + gap + ww / 2;
  // иконка: вращается и увеличивается
  const pi = inv(0.05, 0.75, lt);
  if (pi > 0) {
    const sc = eBack(pi) * (1 + 0.08 * inv(0.75, 2.8, lt));
    ctx.save(); ctx.translate(ix, y); ctx.scale(sc, sc); ctx.rotate((1 - eOut3(pi)) * -2.4); ctx.translate(-ix, -y);
    aiIcon(ix, y, r, 0, lt);
    ctx.restore();
  }
  // слово справа — через общий механизм, но со своим центром
  const p = inv(0.3, 0.75, lt);
  if (p > 0) {
    ctx.save(); ctx.beginPath(); ctx.rect(wx - ww / 2 - 60 * u, y - size * 0.7, ww + 120 * u, size * 1.32); ctx.clip();
    glowText(word, wx, y + (1 - eOut5(p)) * size, size, { split: (1 - eOut3(p)) * 34 * u });
    ctx.restore();
  }
  const p2 = inv(0.9, 1.4, lt);
  if (p2 > 0) {
    ctx.save(); ctx.globalAlpha = eOut3(p2);
    glowText('рядом с каждым тренером', CX, CY + 150 * u + (1 - eOut3(p2)) * 20 * u, 56 * u, { weight: 500, color: C.cyan, glow: C.blue, glowAmt: .7 });
    ctx.restore();
  }
}

function scene4(lt) {
  // лайки летят вверх (за текстом)
  ctx.save();
  ctx.font = `${50 * u}px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const L of LIKES) {
    const a = lt - L.t0; if (a < 0) continue;
    const y = H + 60 * u - a * L.sp * H;
    if (y < -80 * u) continue;
    const x = L.x * W + Math.sin(a * 3 + L.ph) * 40 * u;
    ctx.globalAlpha = 0.5 * clamp(a * 3) * clamp((y + 60 * u) / (H * 0.35));
    ctx.font = `${L.sz * u}px ${EMOJI}`;
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(a * 2.4 + L.ph) * 0.25); ctx.fillText(L.e, 0, 0); ctx.restore();
  }
  ctx.restore();

  const size = fitSize('КАК ПРОШЛА ТРЕНИРОВКА?', maxTextW * 0.9, 120 * u);
  wordsLine('КАК ПРОШЛА ТРЕНИРОВКА?', 150 * u, size, 0.08, lt, { rgb: 28 });
  const p2 = inv(0.5, 0.95, lt);
  if (p2 > 0) {
    ctx.save(); ctx.globalAlpha = eOut3(p2);
    glowText('ты оцениваешь, тренер становится сильнее', CX, 246 * u + (1 - eOut3(p2)) * 16 * u, 46 * u, { weight: 500, color: C.cyan, glow: C.blue, glowAmt: .6 });
    ctx.restore();
  }
  // смайлики
  const em = ['😖', '😐', '🙂', '😀', '🤩'];
  const step = 190 * u, ey = 410 * u, base = 104 * u;
  const pick = inv(2.15, 2.6, lt);
  em.forEach((e, i) => {
    const pa = inv(0.85 + i * 0.16, 0.85 + i * 0.16 + 0.35, lt); if (pa <= 0) return;
    const x = CX + (i - 2) * step;
    let sc = eBack(pa), al = 1;
    const chosen = i === 4;
    if (chosen) sc *= 1 + 0.42 * eBack(pick) + 0.04 * Math.sin(lt * 9) * pick;
    else { al = 1 - 0.72 * pick; sc *= 1 - 0.15 * pick; }
    // подсветка выбранного
    if (chosen && pick > 0) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const rr = base * 1.05 * (1 + 0.3 * pick);
      const g = ctx.createRadialGradient(x, ey, 0, x, ey, rr);
      g.addColorStop(0, hexA(C.cyan, .55 * pick)); g.addColorStop(1, hexA(C.blue, 0));
      ctx.fillStyle = g; ctx.fillRect(x - rr, ey - rr, rr * 2, rr * 2);
      ctx.lineWidth = 5 * u; ctx.strokeStyle = hexA(C.cyan, pick); ctx.shadowColor = C.cyan; ctx.shadowBlur = 30 * u;
      ctx.beginPath(); ctx.arc(x, ey, base * 0.78 * sc, 0, 7); ctx.stroke();
      // лучи
      for (let k = 0; k < 12; k++) {
        const an = k / 12 * 6.283 + lt; const r1 = base * 0.95 * sc, r2 = r1 + 26 * u * pick;
        ctx.beginPath(); ctx.moveTo(x + Math.cos(an) * r1, ey + Math.sin(an) * r1); ctx.lineTo(x + Math.cos(an) * r2, ey + Math.sin(an) * r2); ctx.stroke();
      }
      ctx.restore();
    }
    ctx.save(); ctx.globalAlpha = al; ctx.translate(x, ey); ctx.scale(sc, sc);
    ctx.font = `${base}px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (!chosen && pick > 0) ctx.filter = `grayscale(${pick}) brightness(${1 - 0.4 * pick})`;
    ctx.fillText(e, 0, 4 * u);
    ctx.restore();
  });
}

function scene5(lt) {
  const pl = inv(0.0, 0.6, lt);
  if (pl > 0) {
    const sc = eBack(pl);
    ctx.save(); ctx.translate(CX, 150 * u); ctx.scale(sc, sc); ctx.translate(-CX, -150 * u);
    // ореол за логотипом
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(CX, 150 * u, 0, CX, 150 * u, 160 * u);
    g.addColorStop(0, hexA(C.blue, .45)); g.addColorStop(1, hexA(C.blue, 0));
    ctx.fillStyle = g; ctx.fillRect(CX - 160 * u, -10 * u, 320 * u, 320 * u);
    ctx.restore();
    logo(CX, 150 * u, 100 * u, 1 + 0.3 * Math.sin(lt * 4));
    ctx.restore();
  }
  const size = fitSize('ФИТНЕС ПЛАЗА', maxTextW * 0.9, 168 * u);
  wordsLine('ФИТНЕС ПЛАЗА', 368 * u, size, 0.3, lt, { rgb: 40, stagger: 0.14 });
  // остаточный RGB-«дыхание» на заголовке после появления
  const p2 = inv(0.95, 1.4, lt);
  if (p2 > 0) {
    ctx.save(); ctx.globalAlpha = eOut3(p2);
    glowText('Ухта, Октябрьская, 21 · 24/7', CX, 488 * u + (1 - eOut3(p2)) * 16 * u, 50 * u, { weight: 500, color: C.cyan, glow: C.blue, glowAmt: .7 });
    ctx.restore();
  }
}
const SCENE_FN = [scene1, scene2, scene3, scene4, scene5];

/* =========================================================
   КАДР
   ========================================================= */
function seek(t) {
  t = clamp(t, 0, DURATION - 1e-6);
  let si = 0; for (let i = 0; i < 5; i++) if (t >= STARTS[i]) si = i;
  const lt = t - STARTS[si];

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);

  // камера: удар + медленный наезд 1.0 → 1.06
  const hit = Math.exp(-lt * 7) * (lt < 0.9 ? 1 : 0);
  const shx = noise(t * 38, 1) * 22 * u * hit, shy = noise(t * 41, 2) * 12 * u * hit;
  const rot = noise(t * 30, 3) * 0.006 * hit;
  const zoom = 1 + 0.06 * eInOut(lt / SCENES[si]) + 0.025 * hit;

  // фон движется слабее, чем текст (параллакс)
  ctx.save();
  ctx.translate(CX + shx * 0.4, CY + shy * 0.4); ctx.scale(1 + (zoom - 1) * 0.5, 1 + (zoom - 1) * 0.5); ctx.translate(-CX, -CY);
  drawAura(t); drawGrid(t); drawParticles(t);
  ctx.restore();

  ctx.save();
  ctx.translate(CX + shx, CY + shy); ctx.rotate(rot); ctx.scale(zoom, zoom); ctx.translate(-CX, -CY);
  drawRings(t);
  SCENE_FN[si](lt);
  ctx.restore();

  drawSweep(lt);
  // вспышка на ударе
  if (lt < 0.12) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = hexA(C.cyan, 0.18 * (1 - lt / 0.12)); ctx.fillRect(0, 0, W, H); ctx.restore(); }
  drawBars(t);
  drawHUD(t);
}
window.seek = seek;

/* ---------- живой просмотр ---------- */
let playing = !Q.get('render'), T = 0, last = performance.now();
addEventListener('keydown', e => {
  if (e.code === 'Space') playing = !playing;
  if (e.code === 'ArrowRight') { T += 1 / FPS; seek(T); }
  if (e.code === 'ArrowLeft') { T -= 1 / FPS; seek(T); }
});
document.fonts.load(font(100)).then(() => document.fonts.load(font(100, 500))).then(() => {
  window.READY = true;
  if (!playing) { seek(0); return; }
  (function loop(now) {
    if (playing) { T = (T + (now - last) / 1000) % DURATION; seek(T); }
    last = now; requestAnimationFrame(loop);
  })(performance.now());
});
</script>
</body>
